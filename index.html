<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASDAQ News Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #e8e8f0;
      --muted: #7a7a8e;
      --accent: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --accent-blue: #60a5fa;
      --accent-purple: #a78bfa;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }

    .topbar {
      border-bottom: 1px solid var(--border); padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; position: sticky; top: 0;
      background: rgba(10,10,15,0.92); backdrop-filter: blur(12px); z-index: 100;
    }
    .logo { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .live-badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--accent); border: 1px solid rgba(74,222,128,0.3); padding: 3px 9px; border-radius: 3px; }
    .refresh-btn {
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
      background: transparent; border: 1px solid var(--border2);
      padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 7px;
    }
    .refresh-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .ticker-wrap { border-bottom: 1px solid var(--border); overflow: hidden; height: 38px; display: flex; align-items: center; }
    .ticker-track { display: flex; animation: ticker 40s linear infinite; white-space: nowrap; }
    @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .ticker-item { font-family: var(--font-mono); font-size: 12px; padding: 0 24px; display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--border); }
    .t-sym { color: var(--muted); }
    .t-up { color: var(--accent); }
    .t-dn { color: var(--accent-red); }

    .main { max-width: 1140px; margin: 0 auto; padding: 2rem 1.5rem; }
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.75rem; }

    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .filter-left { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
      padding: 5px 13px; border-radius: 3px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.25); }

    /* Category tab accent colours */
    .filter-btn.active[data-cat="geopolitics"] { color: var(--accent-red);    border-color: rgba(248,113,113,0.4);  background: rgba(248,113,113,0.07); }
    .filter-btn.active[data-cat="trump"]        { color: var(--accent-amber);  border-color: rgba(251,191,36,0.4);   background: rgba(251,191,36,0.07); }
    .filter-btn.active[data-cat="macro"]        { color: var(--accent-purple); border-color: rgba(167,139,250,0.4);  background: rgba(167,139,250,0.07); }
    .filter-btn.active[data-cat="earnings"]     { color: var(--accent);        border-color: rgba(74,222,128,0.4);   background: rgba(74,222,128,0.07); }
    .filter-btn.active[data-cat="tech"]         { color: var(--accent-blue);   border-color: rgba(96,165,250,0.4);   background: rgba(96,165,250,0.07); }
    .filter-btn.active[data-cat="markets"]      { color: var(--text);          border-color: rgba(255,255,255,0.25); background: var(--surface2); }

    .result-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    .rel-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rel-row label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .rel-btn {
      font-family: var(--font-mono); font-size: 11px;
      padding: 4px 13px; border-radius: 3px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .rel-btn:hover { color: var(--text); }
    .rel-btn.active { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.25); }
    .rel-sep { width: 1px; height: 16px; background: var(--border2); }

    .topic-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .topic-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .topic-btn {
      font-family: var(--font-mono); font-size: 10px;
      padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .topic-btn:hover { color: var(--text); }
    .topic-btn.active { color: var(--accent-blue); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.07); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 1.25rem;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 0.15s, background 0.15s; text-decoration: none;
    }
    .card:hover { border-color: var(--border2); background: var(--surface2); }
    .card.rel-high { border-left: 2px solid rgba(74,222,128,0.5); }
    .card.rel-med  { border-left: 2px solid rgba(251,191,36,0.35); }
    .card.rel-low  { border-left: 2px solid transparent; }

    /* Category left-border override */
    .card[data-cat="geopolitics"] { border-left: 2px solid rgba(248,113,113,0.5); }
    .card[data-cat="trump"]       { border-left: 2px solid rgba(251,191,36,0.5); }

    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

    .cat-pill {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
      padding: 2px 8px; border-radius: 3px; border: 1px solid; text-transform: uppercase;
    }
    .pill-markets     { color: var(--text);           border-color: var(--border2);          background: var(--surface2); }
    .pill-earnings    { color: var(--accent);          border-color: rgba(74,222,128,0.3);    background: rgba(74,222,128,0.07); }
    .pill-macro       { color: var(--accent-purple);   border-color: rgba(167,139,250,0.3);   background: rgba(167,139,250,0.07); }
    .pill-tech        { color: var(--accent-blue);     border-color: rgba(96,165,250,0.3);    background: rgba(96,165,250,0.07); }
    .pill-geopolitics { color: var(--accent-red);      border-color: rgba(248,113,113,0.3);   background: rgba(248,113,113,0.07); }
    .pill-trump       { color: var(--accent-amber);    border-color: rgba(251,191,36,0.3);    background: rgba(251,191,36,0.07); }

    .src-pill { font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border2); color: var(--muted); background: var(--surface2); }
    .src-pill.trusted { color: var(--accent-blue); border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.07); }
    .card-time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .card-title { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--text); }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .tag { font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface2); padding: 2px 7px; border-radius: 2px; }
    .rel-badge { font-family: var(--font-mono); font-size: 10px; margin-left: auto; }
    .rel-badge.high { color: var(--accent); }
    .rel-badge.med  { color: var(--accent-amber); }
    .rel-badge.low  { color: var(--muted); opacity: 0.5; }
    .read-link { font-family: var(--font-mono); font-size: 10px; color: var(--accent-blue); opacity: 0.7; }
    .card:hover .read-link { opacity: 1; }

    .placeholder {
      grid-column: 1/-1; padding: 3rem; text-align: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 13px;
      border: 1px dashed var(--border2); border-radius: 6px; line-height: 2.4;
    }
    .spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid rgba(255,255,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media(max-width:640px){
      .topbar { padding: 0 1rem; }
      .main { padding: 1.25rem 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="logo"><div class="logo-dot"></div>NASDAQ / NEWS</div>
  <div class="topbar-right">
    <span class="live-badge">LIVE</span>
    <button class="refresh-btn" id="refreshBtn" onclick="loadNews()">
      <span id="refreshIcon">↻</span> Refresh
    </button>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<main class="main">
  <div class="controls">

    <!-- Category tabs -->
    <div class="filter-row">
      <div class="filter-left">
        <button class="filter-btn active" data-cat="all"          onclick="setCat('all',this)">ALL</button>
        <button class="filter-btn"        data-cat="markets"      onclick="setCat('markets',this)">MARKETS</button>
        <button class="filter-btn"        data-cat="earnings"     onclick="setCat('earnings',this)">EARNINGS</button>
        <button class="filter-btn"        data-cat="macro"        onclick="setCat('macro',this)">MACRO / FED</button>
        <button class="filter-btn"        data-cat="tech"         onclick="setCat('tech',this)">BIG TECH</button>
        <button class="filter-btn"        data-cat="geopolitics"  onclick="setCat('geopolitics',this)">GEOPOLITICS</button>
        <button class="filter-btn"        data-cat="trump"        onclick="setCat('trump',this)">TRUMP</button>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <!-- Relevance -->
    <div class="rel-row">
      <label>RELEVANCE</label>
      <button class="rel-btn active" id="rb-all"  onclick="setRel('all',this)">All</button>
      <div class="rel-sep"></div>
      <button class="rel-btn" id="rb-high" onclick="setRel('high',this)">▲ High</button>
      <button class="rel-btn" id="rb-med"  onclick="setRel('med',this)">◆ Medium</button>
      <button class="rel-btn" id="rb-low"  onclick="setRel('low',this)">▼ Low</button>
    </div>

    <!-- Topic pills -->
    <div class="topic-row">
      <span class="topic-label">TOPIC</span>
      <button class="topic-btn" onclick="toggleTopic('fed')">Fed / Rates</button>
      <button class="topic-btn" onclick="toggleTopic('tariffs')">Tariffs</button>
      <button class="topic-btn" onclick="toggleTopic('war')">War / Conflict</button>
      <button class="topic-btn" onclick="toggleTopic('sanctions')">Sanctions</button>
      <button class="topic-btn" onclick="toggleTopic('earnings')">Earnings</button>
      <button class="topic-btn" onclick="toggleTopic('ipo')">IPO</button>
      <button class="topic-btn" onclick="toggleTopic('ai')">AI</button>
      <button class="topic-btn" onclick="toggleTopic('oil')">Oil / Energy</button>
      <button class="topic-btn" onclick="toggleTopic('china')">China</button>
      <button class="topic-btn" onclick="toggleTopic('crypto')">Crypto</button>
    </div>

  </div>

  <div class="grid" id="grid">
    <div class="placeholder">Loading news...</div>
  </div>
</main>

<script>
  const API_KEY = 'pub_e972259e47b4406fb5dfa2a52a0803c6';

  // ── 5 targeted queries, each costs 1 credit (5/day per refresh) ──────────
  const QUERIES = [
    // 1. Core NASDAQ / market index moves
    `https://newsdata.io/api/1/latest?apikey=${API_KEY}&qInTitle=NASDAQ+OR+%22S%26P+500%22+OR+%22Dow+Jones%22+OR+%22stock+market%22&country=us&language=en&category=business&prioritydomain=top&size=10`,

    // 2. Earnings, Fed, macro fundamentals
    `https://newsdata.io/api/1/latest?apikey=${API_KEY}&qInTitle=earnings+OR+%22Federal+Reserve%22+OR+%22interest+rate%22+OR+inflation+OR+GDP&country=us&language=en&category=business&prioritydomain=top&size=10`,

    // 3. Big tech NASDAQ names
    `https://newsdata.io/api/1/latest?apikey=${API_KEY}&qInTitle=Apple+OR+Microsoft+OR+Nvidia+OR+Amazon+OR+Meta+OR+Google+OR+Tesla+OR+AMD&country=us&language=en&category=business&prioritydomain=top&size=10`,

    // 4. Geopolitics that move markets: wars, sanctions, OPEC, supply chains
    `https://newsdata.io/api/1/latest?apikey=${API_KEY}&qInTitle=Iran+OR+Israel+OR+Ukraine+OR+Russia+OR+China+OR+sanctions+OR+tariff+OR+OPEC+OR+%22trade+war%22+OR+%22supply+chain%22&language=en&category=politics,business&prioritydomain=top&size=10`,

    // 5. Trump statements, executive orders, policy — all market-moving
    `https://newsdata.io/api/1/latest?apikey=${API_KEY}&qInTitle=Trump+OR+%22White+House%22+OR+%22executive+order%22+OR+%22trade+deal%22+OR+tariff&country=us&language=en&prioritydomain=top&size=10`
  ];

  // ── Scoring tables ────────────────────────────────────────────────────────
  const TRUSTED = ['reuters','bloomberg','wsj','cnbc','ft','marketwatch','barrons','forbes','seekingalpha','ap news','associated press','financial times','morningstar','axios'];

  const HIGH_MARKET  = ['nasdaq','s&p 500','dow jones','federal reserve','fed rate','interest rate','earnings per share','eps','ipo','stock split','market cap','bull market','bear market','rally','selloff','recession','gdp','cpi','fomc','powell','sec filing','merger','acquisition','short squeeze','circuit breaker'];
  const HIGH_GEO     = ['iran','israel','ukraine','russia','china','north korea','sanctions','tariff','trade war','trade deal','supply chain','oil embargo','military strike','airstrike','ceasefire','conflict','war','nato','g7','g20','opec','crude oil','brent'];
  const HIGH_TRUMP   = ['trump','white house','executive order','mar-a-lago','truth social','musk','doge','cabinet','administration'];
  const MED_TERMS    = ['stocks','shares','trading','equity','investor','wall street','nyse','etf','dividend','revenue','profit','loss','quarterly','forecast','guidance','analyst','upgrade','downgrade','price target','buyback','hedge fund'];

  const TOPIC_KEYS = {
    fed:       ['federal reserve','fed rate','interest rate','fomc','powell','rate hike','rate cut','monetary policy','quantitative'],
    tariffs:   ['tariff','trade war','trade deal','import duty','export ban','wto'],
    war:       ['war','conflict','military','airstrike','missile','ceasefire','invasion','troops','combat','nuclear'],
    sanctions: ['sanctions','sanction','embargo','export control','blacklist','ofac'],
    earnings:  ['earnings','eps','revenue','quarterly','profit','loss','guidance','beat','miss'],
    ipo:       ['ipo','initial public offering','listing','went public','spac'],
    ai:        ['artificial intelligence','ai','chatgpt','openai','llm','machine learning','generative','nvidia','anthropic'],
    oil:       ['oil','crude','brent','opec','energy','natural gas','petroleum','refinery','pipeline'],
    china:     ['china','chinese','beijing','xi jinping','prc','hong kong','taiwan','renminbi','yuan'],
    crypto:    ['bitcoin','crypto','ethereum','blockchain','defi','coinbase','binance','stablecoin']
  };

  // ── Category detection ────────────────────────────────────────────────────
  function detectCat(a) {
    const t = ((a.title || '') + ' ' + (a.description || '')).toLowerCase();
    if (/trump|white house|executive order|truth social|musk.*policy|doge.*budget/.test(t)) return 'trump';
    if (/iran|israel|ukraine|russia|sanctions|tariff|trade war|opec|military strike|airstrike|ceasefire|north korea/.test(t)) return 'geopolitics';
    if (/earnings|eps|revenue|quarterly|profit|loss|guidance|beat.*estimate|miss.*estimate/.test(t)) return 'earnings';
    if (/federal reserve|fed rate|interest rate|fomc|powell|inflation|gdp|cpi|recession|macro/.test(t)) return 'macro';
    if (/apple|microsoft|nvidia|amazon|meta|alphabet|google|tesla|amd|intel|netflix|salesforce/.test(t)) return 'tech';
    return 'markets';
  }

  // ── Relevance scoring ─────────────────────────────────────────────────────
  function scoreArticle(a) {
    const body  = ((a.title || '') + ' ' + (a.description || '')).toLowerCase();
    const title = (a.title || '').toLowerCase();
    let s = 0;
    HIGH_MARKET.forEach(k => { if (body.includes(k))  s += 3; if (title.includes(k)) s += 2; });
    HIGH_GEO.forEach(k    => { if (body.includes(k))  s += 3; if (title.includes(k)) s += 2; });
    HIGH_TRUMP.forEach(k  => { if (body.includes(k))  s += 3; if (title.includes(k)) s += 2; });
    MED_TERMS.forEach(k   => { if (body.includes(k))  s += 1; });
    if (TRUSTED.some(src  => (a.source_id || '').toLowerCase().includes(src))) s += 4;
    return s;
  }

  function relTier(s) {
    if (s >= 10) return 'high';
    if (s >= 4)  return 'med';
    return 'low';
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let allArticles  = [];
  let catFilter    = 'all';
  let relFilter    = 'all';
  let activeTopics = new Set();

  // ── Render ────────────────────────────────────────────────────────────────
  function renderCards() {
    const grid    = document.getElementById('grid');
    const countEl = document.getElementById('resultCount');

    let list = allArticles;
    if (catFilter !== 'all') list = list.filter(a => a._cat === catFilter);
    if (relFilter !== 'all') list = list.filter(a => a._rel === relFilter);
    if (activeTopics.size > 0) {
      list = list.filter(a => {
        const text = ((a.title||'')+(a.description||'')).toLowerCase();
        return [...activeTopics].some(t => (TOPIC_KEYS[t]||[]).some(k => text.includes(k)));
      });
    }

    countEl.textContent = `${list.length} articles`;

    if (!list.length) {
      grid.innerHTML = '<div class="placeholder">No articles match these filters.<br>Try broadening your selection.</div>';
      return;
    }

    const isTrusted = id => TRUSTED.some(s => (id||'').toLowerCase().includes(s));

    const CAT_PILL = {
      markets:     'pill-markets',
      earnings:    'pill-earnings',
      macro:       'pill-macro',
      tech:        'pill-tech',
      geopolitics: 'pill-geopolitics',
      trump:       'pill-trump'
    };
    const CAT_LABEL = {
      markets: 'Markets', earnings: 'Earnings', macro: 'Macro',
      tech: 'Tech', geopolitics: 'Geopolitics', trump: 'Trump'
    };

    grid.innerHTML = list.map(a => {
      const rl       = a._rel;
      const cat      = a._cat;
      const pillCls  = CAT_PILL[cat] || 'pill-markets';
      const relIcon  = rl === 'high' ? '▲ high' : rl === 'med' ? '◆ mid' : '▼ low';
      const tags     = (a.keywords || []).slice(0,3).map(k => `<span class="tag">${k}</span>`).join('');
      const srcCls   = isTrusted(a.source_id) ? 'src-pill trusted' : 'src-pill';
      const desc     = a.description ? `<div class="card-desc">${a.description}</div>` : '';
      const border   = (cat === 'geopolitics' || cat === 'trump') ? cat : `rel-${rl}`;
      return `
        <a class="card ${border === cat ? '' : 'rel-'+rl}" data-cat="${cat}" href="${a.link||'#'}" target="_blank" rel="noopener noreferrer">
          <div class="card-head">
            <div class="card-meta">
              <span class="cat-pill ${pillCls}">${CAT_LABEL[cat]}</span>
              ${a.source_id ? `<span class="${srcCls}">${a.source_id}</span>` : ''}
            </div>
            <span class="card-time">${timeAgo(a.pubDate)}</span>
          </div>
          <div class="card-title">${a.title||'Untitled'}</div>
          ${desc}
          <div class="card-footer">
            ${tags}
            <span class="rel-badge ${rl}">${relIcon}</span>
            <span class="read-link">read →</span>
          </div>
        </a>`;
    }).join('');
  }

  // ── Filter handlers ───────────────────────────────────────────────────────
  function setCat(cat, el) {
    catFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCards();
  }

  function setRel(rel, el) {
    relFilter = rel;
    document.querySelectorAll('.rel-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCards();
  }

  function toggleTopic(topic) {
    const btn = document.querySelector(`.topic-btn[onclick="toggleTopic('${topic}')"]`);
    if (activeTopics.has(topic)) { activeTopics.delete(topic); btn.classList.remove('active'); }
    else                         { activeTopics.add(topic);    btn.classList.add('active'); }
    renderCards();
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diff < 1)    return 'just now';
    if (diff < 60)   return `${diff}m ago`;
    if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
    return `${Math.floor(diff/1440)}d ago`;
  }

  function buildTicker() {
    const syms = ['AAPL','MSFT','NVDA','AMZN','META','GOOGL','TSLA','NFLX','AMD','INTC','AAPL','MSFT','NVDA','AMZN','META','GOOGL','TSLA','NFLX','AMD','INTC'];
    document.getElementById('tickerTrack').innerHTML = syms.map(t => {
      const chg = (Math.random() * 5 - 1.8).toFixed(2);
      const cls = parseFloat(chg) >= 0 ? 't-up' : 't-dn';
      return `<div class="ticker-item"><span class="t-sym">${t}</span><span class="${cls}">${parseFloat(chg)>=0?'+':''}${chg}%</span></div>`;
    }).join('');
  }

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function loadNews() {
    const btn  = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.disabled = true;
    icon.innerHTML = '<span class="spin"></span>';
    document.getElementById('grid').innerHTML = '<div class="placeholder">Fetching latest news...</div>';
    document.getElementById('resultCount').textContent = '';

    try {
      const responses = await Promise.allSettled(QUERIES.map(u => fetch(u).then(r => r.json())));

      let combined = [];
      for (const r of responses) {
        if (r.status === 'fulfilled' && r.value.status === 'success' && Array.isArray(r.value.results)) {
          combined = combined.concat(r.value.results);
        }
      }

      // Deduplicate
      const seen = new Set();
      allArticles = combined.filter(a => {
        if (!a.title || seen.has(a.title)) return false;
        seen.add(a.title); return true;
      });

      // Enrich
      allArticles.forEach(a => {
        a._score = scoreArticle(a);
        a._rel   = relTier(a._score);
        a._cat   = detectCat(a);
      });

      // Sort: relevance score desc, then newest
      allArticles.sort((a,b) => b._score - a._score || new Date(b.pubDate) - new Date(a.pubDate));

      if (!allArticles.length) {
        document.getElementById('grid').innerHTML = '<div class="placeholder">No articles returned.<br>You may have hit the 200 credit/day free limit — try again tomorrow.</div>';
        return;
      }

      renderCards();
      buildTicker();
    } catch (err) {
      document.getElementById('grid').innerHTML = `<div class="placeholder">Error: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      icon.textContent = '↻';
    }
  }

  buildTicker();
  loadNews();
</script>
</body>
</html>
