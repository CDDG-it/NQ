<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASDAQ News Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #e8e8f0;
      --muted: #7a7a8e;
      --accent: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --accent-blue: #60a5fa;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }

    .topbar {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; position: sticky; top: 0;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(12px); z-index: 100;
    }
    .logo { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .live-badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--accent); border: 1px solid rgba(74,222,128,0.3); padding: 3px 9px; border-radius: 3px; }
    .refresh-btn {
      font-family: var(--font-mono); font-size: 12px; color: var(--muted);
      background: transparent; border: 1px solid var(--border2);
      padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 7px;
    }
    .refresh-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .ticker-wrap { border-bottom: 1px solid var(--border); overflow: hidden; height: 38px; display: flex; align-items: center; }
    .ticker-track { display: flex; animation: ticker 40s linear infinite; white-space: nowrap; }
    @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .ticker-item { font-family: var(--font-mono); font-size: 12px; padding: 0 24px; display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--border); }
    .t-sym { color: var(--muted); }
    .t-up { color: var(--accent); }
    .t-dn { color: var(--accent-red); }

    .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .filter-left { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
      padding: 5px 14px; border-radius: 3px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.25); }
    .result-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 1.25rem;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .card:hover { border-color: var(--border2); background: var(--surface2); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cat-pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 3px; border: 1px solid; text-transform: uppercase; }
    .cat-business   { color: var(--accent-amber); border-color: rgba(251,191,36,0.25);  background: rgba(251,191,36,0.07); }
    .cat-technology { color: var(--accent-blue);  border-color: rgba(96,165,250,0.25);  background: rgba(96,165,250,0.07); }
    .cat-top        { color: var(--accent);        border-color: rgba(74,222,128,0.25);  background: rgba(74,222,128,0.07); }
    .cat-politics   { color: #a78bfa;              border-color: rgba(167,139,250,0.25); background: rgba(167,139,250,0.07); }
    .cat-other      { color: var(--muted);          border-color: var(--border2);          background: var(--surface2); }

    /* Relevance badges */
    .rel-high { color: var(--accent);        font-family: var(--font-mono); font-size: 10px; }
    .rel-med  { color: var(--accent-amber);  font-family: var(--font-mono); font-size: 10px; }
    .rel-low  { color: var(--muted);          font-family: var(--font-mono); font-size: 10px; }

    .card-time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .card-title { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--text); }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .tag { font-family: var(--font-mono); font-size: 10px; color: var(--muted); background: var(--surface2); padding: 2px 7px; border-radius: 2px; }
    .read-link { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--accent-blue); opacity: 0.7; }
    .card:hover .read-link { opacity: 1; }

    /* Relevance filter bar */
    .rel-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .rel-bar label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .rel-btn {
      font-family: var(--font-mono); font-size: 11px;
      padding: 4px 12px; border-radius: 3px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .rel-btn:hover { color: var(--text); }
    .rel-btn.active-high { background: rgba(74,222,128,0.1);  border-color: rgba(74,222,128,0.3);  color: var(--accent); }
    .rel-btn.active-med  { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); color: var(--accent-amber); }
    .rel-btn.active-low  { background: var(--surface2); border-color: var(--border2); color: var(--muted); }

    .placeholder {
      grid-column: 1/-1; padding: 3rem; text-align: center;
      color: var(--muted); font-family: var(--font-mono); font-size: 13px;
      border: 1px dashed var(--border2); border-radius: 6px; line-height: 2.2;
    }
    .spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid rgba(255,255,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to{transform:rotate(360deg)} }

    @media(max-width:600px){
      .topbar { padding: 0 1rem; }
      .main { padding: 1.25rem 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    NASDAQ / NEWS
  </div>
  <div class="topbar-right">
    <span class="live-badge">LIVE</span>
    <button class="refresh-btn" id="refreshBtn" onclick="loadNews()">
      <span id="refreshIcon">↻</span> Refresh
    </button>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<main class="main">

  <!-- Category filters -->
  <div class="filter-row">
    <div class="filter-left">
      <button class="filter-btn active" onclick="setCatFilter('all',this)">ALL</button>
      <button class="filter-btn" onclick="setCatFilter('business',this)">BUSINESS</button>
      <button class="filter-btn" onclick="setCatFilter('technology',this)">TECHNOLOGY</button>
      <button class="filter-btn" onclick="setCatFilter('top',this)">TOP</button>
      <button class="filter-btn" onclick="setCatFilter('politics',this)">POLITICS</button>
    </div>
    <span class="result-count" id="resultCount"></span>
  </div>

  <!-- Relevance filters -->
  <div class="rel-bar">
    <label>RELEVANCE</label>
    <button class="rel-btn active-high" id="rel-high" onclick="setRelFilter('high')">▲ Highly relevant</button>
    <button class="rel-btn active-med"  id="rel-med"  onclick="setRelFilter('med')">◆ Relevant</button>
    <button class="rel-btn active-low"  id="rel-low"  onclick="setRelFilter('low')">▼ Less relevant</button>
    <button class="rel-btn"             id="rel-all"  onclick="setRelFilter('all')" style="margin-left:4px">Show all</button>
  </div>

  <div class="grid" id="grid">
    <div class="placeholder">Loading NASDAQ news...</div>
  </div>
</main>

<script>
  const API_KEY = 'pub_e972259e47b4406fb5dfa2a52a0803c6';

  // Keywords that score relevance
  const HIGH_KEYWORDS = ['nasdaq','s&p','dow','fed','earnings','ipo','stock split','rate','inflation','gdp','fomc','sec','powell','yellen','treasury','yield','bull','bear','rally','selloff','market cap'];
  const MED_KEYWORDS  = ['stocks','trading','shares','equity','investor','portfolio','wall street','nyse','etf','dividend','revenue','profit','loss','quarterly','forecast','guidance'];

  const TICKERS = ['AAPL','MSFT','NVDA','AMZN','META','GOOGL','TSLA','NFLX','AMD','INTC','AAPL','MSFT','NVDA','AMZN','META','GOOGL','TSLA','NFLX','AMD','INTC'];

  let allArticles = [];
  let catFilter = 'all';
  let relFilter = 'high'; // default: show most relevant

  function scoreArticle(a) {
    const text = ((a.title || '') + ' ' + (a.description || '')).toLowerCase();
    let score = 0;
    HIGH_KEYWORDS.forEach(k => { if (text.includes(k)) score += 3; });
    MED_KEYWORDS.forEach(k => { if (text.includes(k)) score += 1; });
    // Bonus for trusted sources
    const trusted = ['reuters','bloomberg','wsj','ft','cnbc','marketwatch','barrons','forbes','yahoo finance','financial times'];
    if (trusted.some(s => (a.source_id || '').toLowerCase().includes(s))) score += 3;
    return score;
  }

  function relLabel(score) {
    if (score >= 6) return 'high';
    if (score >= 2) return 'med';
    return 'low';
  }

  function buildTicker() {
    const track = document.getElementById('tickerTrack');
    track.innerHTML = TICKERS.map(t => {
      const chg = (Math.random() * 5 - 1.8).toFixed(2);
      const cls = parseFloat(chg) >= 0 ? 't-up' : 't-dn';
      return `<div class="ticker-item"><span class="t-sym">${t}</span><span class="${cls}">${parseFloat(chg) >= 0 ? '+' : ''}${chg}%</span></div>`;
    }).join('');
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diff < 1) return 'just now';
    if (diff < 60) return `${diff}m ago`;
    if (diff < 1440) return `${Math.floor(diff / 60)}h ago`;
    return `${Math.floor(diff / 1440)}d ago`;
  }

  function getCatClass(cats) {
    if (!cats || !cats.length) return 'cat-other';
    const c = cats[0].toLowerCase();
    if (c.includes('tech')) return 'cat-technology';
    if (c.includes('bus'))  return 'cat-business';
    if (c.includes('top'))  return 'cat-top';
    if (c.includes('pol'))  return 'cat-politics';
    return 'cat-other';
  }

  function renderCards() {
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('resultCount');

    let filtered = allArticles;

    // Category filter
    if (catFilter !== 'all') {
      filtered = filtered.filter(a => (a.category || []).some(c => c.toLowerCase().includes(catFilter)));
    }

    // Relevance filter
    if (relFilter !== 'all') {
      filtered = filtered.filter(a => relLabel(a._score) === relFilter);
    }

    countEl.textContent = `${filtered.length} articles`;

    if (!filtered.length) {
      grid.innerHTML = '<div class="placeholder">No articles match this filter.</div>';
      return;
    }

    grid.innerHTML = filtered.map(a => {
      const cc = getCatClass(a.category);
      const cl = (a.category && a.category[0]) ? a.category[0] : 'news';
      const rl = relLabel(a._score);
      const relIcon = rl === 'high' ? '<span class="rel-high">▲ high</span>' : rl === 'med' ? '<span class="rel-med">◆ relevant</span>' : '<span class="rel-low">▼ low</span>';
      const tags = (a.keywords || []).slice(0, 3).map(k => `<span class="tag">${k}</span>`).join('');
      const src  = a.source_id ? `<span class="tag">${a.source_id}</span>` : '';
      const desc = a.description ? `<div class="card-desc">${a.description}</div>` : '';
      return `
        <a class="card" href="${a.link || '#'}" target="_blank" rel="noopener noreferrer">
          <div class="card-head">
            <span class="cat-pill ${cc}">${cl}</span>
            <span class="card-time">${timeAgo(a.pubDate)}</span>
          </div>
          <div class="card-title">${a.title || 'Untitled'}</div>
          ${desc}
          <div class="card-footer">${tags}${src}${relIcon}<span class="read-link">read →</span></div>
        </a>`;
    }).join('');
  }

  function setCatFilter(cat, el) {
    catFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCards();
  }

  function setRelFilter(level) {
    relFilter = level;
    ['high','med','low','all'].forEach(l => {
      const btn = document.getElementById('rel-' + l);
      if (btn) btn.classList.remove('active-high','active-med','active-low');
    });
    const active = document.getElementById('rel-' + level);
    if (active) {
      if (level === 'high') active.classList.add('active-high');
      else if (level === 'med') active.classList.add('active-med');
      else if (level === 'low') active.classList.add('active-low');
    }
    renderCards();
  }

  async function loadNews() {
    const btn  = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.disabled = true;
    icon.innerHTML = '<span class="spin"></span>';
    document.getElementById('grid').innerHTML = '<div class="placeholder">Fetching latest NASDAQ news...</div>';
    document.getElementById('resultCount').textContent = '';

    try {
      const urls = [
        `https://newsdata.io/api/1/news?apikey=${API_KEY}&q=Nasdaq+OR+Stocks+OR+Trading&country=us&language=en,nl&prioritydomain=top&size=10`,
        `https://newsdata.io/api/1/news?apikey=${API_KEY}&q=Wall+Street+OR+earnings+OR+S%26P500&country=us&language=en&prioritydomain=top&size=10`
      ];

      const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));

      let combined = [];
      for (const res of responses) {
        if (res.status === 'success' && Array.isArray(res.results)) {
          combined = combined.concat(res.results);
        } else if (res.message) {
          throw new Error(res.message);
        }
      }

      // Deduplicate by title
      const seen = new Set();
      allArticles = combined.filter(a => {
        if (!a.title || seen.has(a.title)) return false;
        seen.add(a.title);
        return true;
      });

      // Score and sort by relevance then recency
      allArticles.forEach(a => { a._score = scoreArticle(a); });
      allArticles.sort((a, b) => b._score - a._score || new Date(b.pubDate) - new Date(a.pubDate));

      renderCards();
      buildTicker();
    } catch (err) {
      document.getElementById('grid').innerHTML = `<div class="placeholder">Could not load news: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      icon.textContent = '↻';
    }
  }

  buildTicker();
  loadNews();
</script>
</body>
</html>
