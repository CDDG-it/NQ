name: Update Dashboard

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:       # lets you trigger it manually too

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch news and rebuild dashboard
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone

          # Fetch financial news from newsdata.io
          url = f"https://newsdata.io/api/1/news?apikey={__import__('os').environ['NEWS_API_KEY']}&q=NQ+futures+OR+nasdaq+OR+markets+OR+economy+OR+fed+OR+oil+OR+iran&language=en&category=business"

          try:
              with urllib.request.urlopen(url, timeout=15) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f"API error: {e}")
              exit(0)

          articles = data.get("results", [])[:8]

          rows = ""
          for a in articles:
              title = a.get("title", "").replace('"', '&quot;').replace('<', '&lt;').replace('>', '&gt;')
              source = (a.get("source_id") or "").replace('-', ' ').title()[:18]
              link = a.get("link") or "#"
              pub = a.get("pubDate") or ""
              try:
                  date_str = datetime.strptime(pub[:10], "%Y-%m-%d").strftime("%b %d")
              except:
                  date_str = pub[:10]

              # simple keyword sentiment
              lower = title.lower()
              bear_words = ["fall","drop","slump","crash","recession","fear","risk","warn","decline","down","lose","loss","sell","correction","plunge"]
              bull_words = ["rise","gain","rally","surge","climb","high","record","beat","strong","growth","bull","up","boost"]
              if any(w in lower for w in bear_words):
                  sent = '<span style="color:#ff4757;font-family:\'IBM Plex Mono\',monospace;font-size:10px;">BEAR</span>'
              elif any(w in lower for w in bull_words):
                  sent = '<span style="color:#00d084;font-family:\'IBM Plex Mono\',monospace;font-size:10px;">BULL</span>'
              else:
                  sent = '<span style="color:#ffb236;font-family:\'IBM Plex Mono\',monospace;font-size:10px;">NEUTRAL</span>'

              rows += f"""
              <tr>
                <td class="col-date">{date_str}</td>
                <td class="col-headline">{title}</td>
                <td class="col-source">{source}</td>
                <td class="col-sent">{sent}</td>
                <td class="col-link"><a href="{link}" target="_blank">→</a></td>
              </tr>"""

          # Read index.html and replace placeholder
          with open("index.html", "r") as f:
              html = f.read()

          html = re.sub(r'<!-- AUTO-GENERATED.*?-->\s*PLACEHOLDER_NEWS', f'<!-- AUTO-GENERATED BY GITHUB ACTIONS — DO NOT EDIT MANUALLY -->\n      {rows}', html, flags=re.DOTALL)

          with open("index.html", "w") as f:
              f.write(html)

          print(f"Done. Injected {len(articles)} articles.")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: auto-update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
