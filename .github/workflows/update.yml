name: Update Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch news and rebuild dashboard
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import urllib.request
          import json
          import re
          import os
          from datetime import datetime, timezone

          api_key = os.environ['NEWS_API_KEY']
          url = f"https://newsdata.io/api/1/news?apikey={api_key}&q=nasdaq+markets+economy+fed+oil&language=en&category=business"

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f"API error: {e}")
              exit(0)

          articles = data.get("results", [])[:8]
          if not articles:
              print("No articles returned.")
              exit(0)

          bear_words = ["fall","drop","slump","crash","recession","fear","risk","warn","decline","down","loss","sell","correction","plunge","tumble","slide","weak","miss","cut"]
          bull_words = ["rise","gain","rally","surge","climb","high","record","beat","strong","growth","bull","boost","jump","soar","top","exceed"]

          rows = ""
          for a in articles:
              title = (a.get("title") or "").replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"','&quot;')
              source = (a.get("source_id") or "").replace("-"," ").title()[:20]
              link = a.get("link") or "#"
              pub = a.get("pubDate") or ""
              try:
                  date_str = datetime.strptime(pub[:10], "%Y-%m-%d").strftime("%b %d")
              except:
                  date_str = pub[:10] if pub else "—"

              lower = title.lower()
              if any(w in lower for w in bear_words):
                  badge = '<span class="sent-badge sent-bear">BEAR</span>'
              elif any(w in lower for w in bull_words):
                  badge = '<span class="sent-badge sent-bull">BULL</span>'
              else:
                  badge = '<span class="sent-badge sent-neutral">NEUTRAL</span>'

              rows += f"""    <div class="news-row">
                <div class="news-date">{date_str}</div>
                <div class="news-headline">{title}</div>
                <div class="news-source">{source}</div>
                <div>{badge}</div>
                <div class="news-link"><a href="{link}" target="_blank">→</a></div>
              </div>\n"""

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          new_html = re.sub(
              r'<!-- NEWS_START -->.*?<!-- NEWS_END -->',
              f'<!-- NEWS_START -->\n{rows}    <!-- NEWS_END -->',
              html,
              flags=re.DOTALL
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_html)

          print(f"Injected {len(articles)} articles.")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
